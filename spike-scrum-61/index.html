<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCRUM-61 — Viewer Perf Spike</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; font-family: system-ui, sans-serif; }
      #osd { position: absolute; inset: 0; background: #2a2a2a; }
      /* Konva overlay sits on top but lets all pointer events through to OSD;
         hit-testing is done manually against image coords (see main.js). */
      #overlay { position: absolute; inset: 0; pointer-events: none; }
      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        background: rgba(20, 20, 20, 0.92); color: #eee;
        padding: 12px 14px; border-radius: 8px;
        font-size: 13px; line-height: 1.8; min-width: 250px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }
      #hud h1 { font-size: 12px; color: #6cf; margin-bottom: 4px; letter-spacing: 0.02em; }
      #hud .big { font-size: 26px; font-weight: 700; color: #6f6; }
      #hud label { display: block; cursor: pointer; user-select: none; }
      #hud button {
        margin-top: 8px; width: 100%; padding: 6px; cursor: pointer;
        background: #6cf; border: 0; border-radius: 5px; font-weight: 600;
      }
      #hud button:disabled { opacity: 0.5; cursor: default; }
      #hud .row { color: #aaa; }
      #hud .status { color: #fc6; font-size: 12px; margin-top: 6px; word-break: break-word; }
    </style>
  </head>
  <body>
    <div id="osd"></div>
    <div id="overlay"></div>
    <div id="hud">
      <h1>SCRUM-61 · VIEWER PERF SPIKE</h1>
      <div><span class="big" id="fps">0</span> fps (live)</div>
      <div class="row">hover hit: <span id="hit">—</span></div>
      <label><input type="checkbox" id="hitGraph" checked /> Konva hit-graph (listening)</label>
      <label><input type="checkbox" id="cull" /> Viewport culling</label>
      <button id="bench">Run pan/zoom benchmark</button>
      <div class="status" id="status">booting…</div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
